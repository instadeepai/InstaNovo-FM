[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mass_spectrometry_foundation_model"
readme = "README.md"
license = { file = "LICENSE.md" }
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ase==3.22.1",
    "fire==0.6.0",
    "h5py==3.11.0",
    "huggingface-hub==0.24.5",
    "igraph==0.11.4",
    "matchms==0.24.2",
    "molplotly==1.1.7",
    "msml",
    "numba==0.57.1",
    "numpy>=1.24.4",
    "pandarallel==1.6.5",
    "pandas==2.2.1",
    "plotly==5.20.0",
    "pyarrow==15.0.2",
    "pyopenms==3.0.0",
    "pytorch-lightning==2.0.8",
    "rdkit==2023.9.5",
    "s3fs>=2025.3.0",
    "seaborn==0.13.2",
    "torch==2.2.1",
    "torchmetrics==1.3.2",
    "umap-learn==0.5.6",
    "wandb==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
msml = { git = "https://github.com/roman-bushuiev/msml_legacy_architectures.git", rev = "main" }

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
]
