[project]
name = "instanovo-fm"
version = "0.1.0.dev0"
description = "InstaNovo-FM: a self-supervised foundation model for tandem mass spectra"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }

# Runtime dependencies land here as the model and dataset code is ported.
# Pinned rather than ranged, and deliberately aligned with the internal repo so
# the notebooks, the dataset pipeline and the foundation-model code resolve to
# one environment. instanovo itself is pinned exactly: the foundation-model code
# uses instanovo.common's trainer and SpectrumDataFrame's private _cast_columns,
# neither of which is API-stable across releases.
dependencies = [
  # Pinned exactly: the ported scripts use instanovo.constants,
  # instanovo.utils.residues and SpectrumDataFrame (including its private
  # _cast_columns), none of which are API-stable across releases.
  "instanovo==1.2.2",
  # torch is not used directly by the scripts; it arrives transitively via
  # instanovo -> accelerate>=1.6.0. instanovo 1.2.2 does pin torch, but only inside
  # its cpu/cu124/cu126 extras, and we select none of them -- so nothing enforced
  # the ceiling and the resolver took torch 2.13, well outside anything instanovo
  # was tested against. These mirror instanovo's own ranges, which differ by
  # platform: <2.9 on Linux and Windows, <2.8 on macOS.
  "torch>=2.5,<2.9; sys_platform != 'darwin'",
  "torch>=2.5,<2.8; sys_platform == 'darwin'",
  "polars>=1.12.0",
  # Pinned to the versions the manuscript's results were produced with, taken from
  # the development lockfile. Reproducibility is this repository's purpose, so these
  # are exact rather than floors -- see SECURITY.md for the advisories this accepts
  # and why.
  "pyarrow==22.0.0",
  "pandas>=2.2.3",
  "numpy==2.2.6",
  # instanovo 1.2.2 requires >=0.15.1, and click 8.2 made
  # `Parameter.make_metavar()` take a required `ctx` argument that typer 0.15.1
  # does not pass -- every `--help` rendering an options panel raised TypeError.
  # 0.27 passes it, so click needs no upper cap.
  "typer==0.27.2",
  "click>=8.1.7",
  "tqdm>=4.67.0",
  "pyyaml>=6.0.2",
  "numba>=0.60.0",          # instanovo_fm.utils.lsh; 0.60 added numpy-2.0 support
  "pyteomics>=4.7.5",       # USI construction, UNIMOD masses
  "lxml>=4.9.4",            # UNIMOD XML
  "scikit-learn>=1.5.2",
  "openpyxl>=3.1.5",        # search-data / mod-dict spreadsheets
  "xlsxwriter>=3.2.0",
  "fastexcel>=0.12.0",
  # foundation model + evaluation harness. torch, accelerate, hydra-core,
  # omegaconf, datasets, jaxtyping, scipy and spectrum-utils already arrive via
  # instanovo, so only these are additional.
  "h5py>=3.12.0",           # embedding_io
  "rustyms>=0.10.0",        # fragment annotation
  "captum>=0.7.0",          # integrated-gradients attribution
  "faiss-cpu>=1.9.0",       # duplicate-retrieval eval
  "umap-learn>=0.5.7",      # UMAP eval task
  "pyopenms>=3.4.0",        # theoretical spectra
  "mlflow>=2.17.0",         # experiment tracking (disabled by default in configs)
]

[project.scripts]
instanovo-fm = "instanovo_fm.cli:cli"

[project.optional-dependencies]
# S3 access for the ACFM sync/restore scripts. Optional: the labelled-tier
# pipeline runs entirely on local parquet.
s3 = ["s3fs>=2024.12.0", "boto3>=1.35.36"]

# Kept out of the default resolution because each is awkward to install, not
# because it is unimportant. Every task that needs one skips cleanly when it is
# absent, so `uv sync` still gives a working model and evaluation harness.
# No `gpu` extra for cuML. Locking it caps pyarrow at <19 through cudf-cu12, which
# drags the whole universal lock back from pyarrow 22/25 to 18.1.0 -- for every
# install, not only those selecting the extra -- and pulls a hard `distributed==...`
# pin. Development deliberately kept RAPIDS out of the lockfile for the same reason
# and installed it as a separate step; see docs/gpu-probes.md. The cuML linear
# probes fall back to scikit-learn when it is absent.
interpret = ["glass-box-umap>=0.1"]  # pulls pytorch-lightning
clustering = ["evoc>=0.3"]           # EvoC clustering eval task
# No `baselines` extra: casanovo pins numpy<2.0 while instanovo 1.2.2 requires
# numpy>=2.0.2, so casanovo cannot share this environment at all. That is why the
# internal repo installed it as a separate pip step rather than locking it.
# Extract Casanovo baseline embeddings from its own environment instead --
# eval/extract_casanovo_embeddings.py writes the same HDF5 format, so the eval
# harness consumes the output either way.

[dependency-groups]
# Everything notebooks/figure_{1,3,4}.ipynb need. Install with:
#   uv sync --group figures
figures = [
  # Notebook-only libraries. numpy/pandas/pyarrow/scikit-learn come from
  # [project.dependencies] so both halves of the repo share one resolution.
  "matplotlib>=3.9.4",
  "seaborn>=0.13.2",
  "scipy>=1.13.1",
  "plotly>=6.8.0",
  "kaleido>=1.3.0",
  "circlify>=0.15.1",
  "jupyter-client>=8.6.3",
  "nbconvert>=7.17.1",
  "nbformat>=5.10.4",
  "ipykernel>=6.31.0",
]

dev = [
  "pytest==8.3.3",
  "pandas>=2.2.3",
  "openpyxl>=3.1.5",
  # Pinned to the versions .pre-commit-config.yaml uses, so a local
  # pre-commit run and CI cannot disagree about what passes.
  "pre-commit>=4.0.0",
  "ruff==0.6.9",
  "mypy==1.11.2",
  "types-PyYAML",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instanovo_fm"]

[tool.hatch.build.targets.wheel.force-include]
# Hydra configs ship with the package so a pip install is usable.
"src/instanovo_fm/configs" = "instanovo_fm/configs"

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
src = ["src", "scripts"]

[tool.ruff.format]
# Formatting would rewrite the ported files wholesale; they are kept diffable
# against their originals in the internal repo.
exclude = ["scripts/**", "tests/scripts/**", "tests/unit_test/**", "src/instanovo_fm/**", "docker/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "T20"]

# scripts/ is a faithful port of the dataset pipeline from the internal repo and
# src/instanovo_fm/utils/lsh.py is vendored verbatim. Both are kept diffable
# against their originals, so only rules that catch real defects are enforced
# there: pyflakes (undefined names, unused imports), syntax errors, and bugbear.
# The 795 findings suppressed here are typing modernisation (Dict -> dict),
# line length and import order -- none of them correctness. Rewriting scientific
# code that cannot be exercised in CI, to satisfy cosmetic rules, is not a
# trade worth making. New code under src/ and tests/ is held to the full set.
[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["UP", "I001", "E501", "B904", "B905"]
# tests/scripts/ and tests/unit_test/foundational/ are the ported suites; same
# reasoning as scripts/. E402: some tests keep skip guards before the imports
# they protect, so those imports cannot sit at the top of the file.
"tests/unit_test/foundational/**" = ["UP", "I001", "E501", "E402", "E7", "W2", "W3",
                                    "F401", "F541", "F722", "F841", "B", "C4", "E4"]
"tests/scripts/**" = ["UP", "I001", "E501", "B904", "B905", "E741", "F841", "E402"]
# tests/unit_test/downstream_denovo_test/ is the ported de novo suite; same
# reasoning as the two above. Only E501 fires, so only E501 is ignored.
"tests/unit_test/downstream_denovo_test/**" = ["E501"]
# B904/B905 are inherited from the internal repo and are *potential* defects,
# not confirmed ones. B905 in particular asks whether a zip() is meant to
# truncate: silencing it with strict=False would assert an intent nobody has
# verified, on pipeline code that cannot be exercised in CI. Left as-is for
# review by someone who can run it; the 13 sites are listed in the PR.
# The whole ported package is kept diffable against its source branch.
# F722 is jaxtyping's annotation syntax, which ruff cannot parse; the source
# branch ignored it for the same reason -- it fires 37 times here. F821 is NOT
# ignored: it fires exactly once, on the one single-element shape string
# (Float[Tensor, "B"] in model/heads.py), which carries a noqa. Ignoring it
# package-wide would hide genuine undefined names across 65k lines.
# W29x/E702/F401 are formatting and unused-import noise across 65k ported lines.
# T20 asks for logging instead of print, which fires 66 times across the ported
# analysers and their CLI entry points. Rewriting their output plumbing is the
# same trade the rest of this list declines; scripts/ satisfies the rule with
# per-line noqa, which would mean 66 edits to files kept diffable.
"src/instanovo_fm/**" = ["UP", "I001", "I002", "E501", "E402", "E7", "W2", "W3",
                         "F401", "F541", "F722", "F841", "B", "C4", "E4", "T20"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
# scripts/ is a package in the repo root, not an installed one; the ported tests
# import through `scripts.preprocessing...` exactly as they did internally.
pythonpath = ["."]
testpaths = ["tests"]
