[project]
name = "instanovo-fm"
version = "0.1.0.dev0"
description = "InstaNovo-FM: a self-supervised foundation model for tandem mass spectra"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }

# Runtime dependencies land here as the model and dataset code is ported.
# Pinned rather than ranged, and deliberately aligned with the internal repo so
# the notebooks, the dataset pipeline and the foundation-model code resolve to
# one environment. instanovo itself is pinned exactly: the foundation-model code
# uses instanovo.common's trainer and SpectrumDataFrame's private _cast_columns,
# neither of which is API-stable across releases.
dependencies = []

[dependency-groups]
# Everything notebooks/figure_{1,3,4}.ipynb need. Install with:
#   uv sync --group figures
figures = [
  "pandas==2.2.3",
  "numpy==1.26.4",
  "matplotlib==3.9.4",
  "seaborn==0.13.2",
  "scipy==1.13.1",
  "scikit-learn==1.5.2",
  "plotly==6.8.0",
  "kaleido==1.3.0",
  "circlify==0.15.1",
  "openpyxl==3.1.5",
  "pyarrow==18.0.0",
  "jupyter-client==8.6.3",
  "nbconvert==7.17.1",
  "nbformat==5.10.4",
  "ipykernel==6.31.0",
]

dev = [
  "pytest==8.3.3",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
  # Pinned to the versions .pre-commit-config.yaml uses, so a local
  # pre-commit run and CI cannot disagree about what passes.
  "ruff==0.6.9",
  "mypy==1.11.2",
]

[tool.uv]
# Not an installable package yet — src/instanovo_fm/ arrives with the model port.
# Until then `uv sync` should resolve dependencies without trying to build.
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
