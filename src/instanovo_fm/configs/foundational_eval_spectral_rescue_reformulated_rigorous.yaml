# Rigorous reformulated spectral rescue evaluation (deduped + stratified negatives).
# Default scope is single_base (one peptide pair). For a multi-pair panel see
# foundational_eval_spectral_rescue_reformulated_multi_base.yaml.

defaults:
  - foundational_eval_spectral_rescue_reformulated
  - _self_

evaluation:
  output_dir: "instanovo/foundational/eval/embed_eval_results/spectral_rescue_rigorous"
  save_embeddings: True
  force_regenerate_embeddings: False
  task_configs:
    spectralrescuetaskreformulated:
      num_reference_queries: 50
      num_modified_queries: 50
      max_base_positives: 50
      max_negatives: 200
      max_queries_per_raw_file: 1
      negative_sampling: "stratified_by_edit_distance"
      similarity_batch_size: 500
      plot_max_pair_scores: 50000
      sample_seed: 42
